
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Expense | Daily Expense Tracker</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header>
        <h1>Daily Expense Tracker</h1>
        <p>Update your expense details</p>
    </header>

    <main>

        <section class="expense-form-card">

            <h2>Edit Expense</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <p class="flash-message {{ category }}">
                        {{ message }}
                    </p>
                {% endfor %}
            {% endwith %}

            <form method="POST"
                  action="{{ url_for('edit_expense', expense_id=expense['id']) }}">

                <div class="form-group">
                    <label>Expense Title</label>

                    <input type="text"
                           name="title"
                           value="{{ expense['description'] }}"
                           maxlength="100"
                           required>
                </div>

                <div class="form-group">
                    <label>Amount (₹)</label>

                    <input type="number"
                           name="amount"
                           value="{{ expense['amount'] }}"
                           min="0.01"
                           step="0.01"
                           required>
                </div>

                <div class="form-group">
                    <label>Category</label>

                    <select name="category" required>

                        <option value="Food"
                            {% if expense['category'] == 'Food' %}selected{% endif %}>
                            Food
                        </option>

                        <option value="Travel"
                            {% if expense['category'] == 'Travel' %}selected{% endif %}>
                            Travel
                        </option>

                        <option value="Shopping"
                            {% if expense['category'] == 'Shopping' %}selected{% endif %}>
                            Shopping
                        </option>

                        <option value="Bills"
                            {% if expense['category'] == 'Bills' %}selected{% endif %}>
                            Bills
                        </option>

                        <option value="Entertainment"
                            {% if expense['category'] == 'Entertainment' %}selected{% endif %}>
                            Entertainment
                        </option>

                        <option value="Other"
                            {% if expense['category'] == 'Other' %}selected{% endif %}>
                            Other
                        </option>

                    </select>
                </div>

                <div class="form-group">
                    <label>Date</label>

                    <input type="date"
                           name="date"
                           value="{{ expense['expense_date'] }}"
                           required>
                </div>

                <button type="submit" class="add-expense-btn">
                    Update Expense
                </button>

            </form>

            <a href="{{ url_for('home') }}" class="back-link">
                Back to Dashboard
            </a>

        </section>

    </main>

</body>
</html>
